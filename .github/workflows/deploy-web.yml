name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The app's tests import Cloud Functions code, so the functions dependencies must be installed before the app typecheck.
      - run: npm --prefix functions ci
      - run: npm run typecheck
      - run: npx vitest run --exclude 'tests/rules/**'
      - run: npm --prefix functions run typecheck
      # GitHub Pages serves the site under /<repo>/, so the web build needs that base path.
      - name: Set web base path
        run: jq --arg base "/${GITHUB_REPOSITORY#*/}" '.expo.experiments.baseUrl = $base' app.json > app.tmp.json && mv app.tmp.json app.json
      - run: npx expo export --platform web
        env:
          CI: 1
      - name: Prepare Pages output
        run: |
          cp "dist/+not-found.html" dist/404.html
          touch dist/.nojekyll
      # GitHub Pages cannot send security headers, so the CSP goes into every page as a meta tag.
      - run: node scripts/add-web-security-meta.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
